<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>تطبيق سيلفي</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-slate-100 via-white to-emerald-50">

  <main class="min-h-screen flex items-center justify-center px-5 py-10">

    <div class="w-full max-w-md">

      <!-- Main Card -->
      <div class="bg-white/60 backdrop-blur-2xl
                  border border-white/80 rounded-3xl
                  p-7 shadow-xl">

        <div class="text-center">

          <div class="inline-flex items-center px-3 py-1
                      rounded-full bg-emerald-50
                      text-emerald-600 text-xs font-medium">
            تطبيق Android
          </div>

          <h1 class="mt-5 text-3xl font-bold text-gray-900">
            تطبيق سيلفي
          </h1>

          <p class="mt-3 text-gray-500 text-sm leading-6">
            تطبيق مخصص لالتقاط صور السيلفي وإتمام عملية التحقق بسهولة.
          </p>

        </div>

        <!-- App Information -->
        <div class="mt-7 grid grid-cols-2 gap-3">

          <div class="bg-white/70 border border-gray-100
                      rounded-2xl p-4 text-center">
            <p class="text-xs text-gray-400">الإصدار</p>
            <p class="mt-1 font-semibold text-gray-800">1.0.0</p>
          </div>

          <div class="bg-white/70 border border-gray-100
                      rounded-2xl p-4 text-center">
            <p class="text-xs text-gray-400">حجم التطبيق</p>
            <p class="mt-1 font-semibold text-gray-800">80 MB</p>
          </div>

        </div>

        <!-- Download -->
        <a
          href="https://github.com/agencyope/selfie/releases/download/tag/selfie.apk"
          download
          class="mt-6 block w-full text-center
                 bg-emerald-500 hover:bg-emerald-600
                 text-white font-bold py-3.5 rounded-2xl
                 transition shadow-md"
        >
          تحميل التطبيق
        </a>

        <p class="mt-3 text-center text-xs text-gray-400">
          ملف APK لنظام Android
        </p>

      </div>

      <!-- Information -->
      <div class="mt-5 bg-white/50 backdrop-blur-xl
                  border border-white/70 rounded-2xl
                  p-5 shadow-sm">

        <h2 class="font-semibold text-gray-800">
          حول التطبيق
        </h2>

        <p class="mt-2 text-sm text-gray-500 leading-6">
          يتيح لك التطبيق التقاط صورة سيلفي واستخدامها
          لإتمام عملية التحقق المطلوبة.
        </p>

      </div>

      <p class="mt-6 text-center text-xs text-gray-400">
        © 2026 تطبيق سيلفي
      </p>

    </div>

  </main>

</body>
</html>
